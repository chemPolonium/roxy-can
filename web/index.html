<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9edf3" />
    <script>
      // Apply the saved theme before the first paint; main.tsx repeats this
      // after the bundle loads, which would otherwise flash light in dark mode.
      try {
        const theme =
          localStorage.getItem("roxy-can-web.theme") === "dark"
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0a0c10" : "#e9edf3");
      } catch {
        // Storage can be blocked; the light default still applies.
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2b5c'/%3E%3Ctext x='32' y='45' font-family='Segoe UI,sans-serif' font-size='40' font-weight='700' fill='%2356b6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E"
    />
    <title>Roxy CAN</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "roxy-can"
version = "0.17.7"
edition = "2024"

[dependencies]
# The local axum host for the Vite build, and the async runtime it needs.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
# Hardware probing uses the Windows device enumeration API.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
can-dbc = "10.0"
chrono = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Hand-edited profiles (profiles/*.toml) parse through toml_edit, which
# is already in the dependency tree; the `toml` wrapper is not.
# Parse-only: the profile reader never writes TOML.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
memmap2 = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# FlexRay database parsing (FIBEX / AUTOSAR ARXML), namespaced XML without
# a schema step -- the same parser roxy-fibex uses.
roxmltree = "0.21"

[build-dependencies]
# build.rs puts roxy-can.ico into the exe's PE resources (Windows only).
winresource = "0.1"

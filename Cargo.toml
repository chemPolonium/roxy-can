[package]
name = "roxy-can"
version = "0.17.0"
edition = "2024"

[dependencies]
# dear-imgui-rs binds Dear ImGui 1.92.x (docking branch, docking always on).
# The wgpu backend's default feature targets wgpu 30; pin it to our wgpu 29.
dear-imgui-rs = "0.18"
dear-imgui-cte = "0.18"
dear-imgui-wgpu = { version = "0.18", default-features = false, features = ["wgpu-29"] }
dear-imgui-winit = "0.18"
wgpu = "29"
# The OS clipboard backend dear-imgui-rs expects the app to provide.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
winit = "0.30"
pollster = "0.4"
can-dbc = "10.0"
chrono = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Hand-edited profiles (profiles/*.toml) parse through toml_edit, which
# is already in the dependency tree; the `toml` wrapper is not.
# Parse-only: the profile reader never writes TOML.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
memmap2 = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# FlexRay database parsing (FIBEX / AUTOSAR ARXML), namespaced XML without
# a schema step -- the same parser roxy-fibex uses.
roxmltree = "0.21"
